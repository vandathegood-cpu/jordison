name: Evilginx Session Capture

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential curl wget jq

      - name: Clone Evilginx
        run: |
          git clone https://github.com/kgretzky/evilginx2.git
          cd evilginx2
          make
          sudo cp evilginx /usr/local/bin/

      - name: Configure Evilginx
        run: |
          sudo mkdir -p /etc/evilginx/certs
          openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=example.com"
          sudo cp cert.pem /etc/evilginx/certs/fullchain.pem
          sudo cp key.pem /etc/evilginx/certs/privkey.pem

      - name: Start Evilginx
        run: |
          evilginx &
          sleep 8
          echo "domains"
          echo "phishlets"
          sleep 300
